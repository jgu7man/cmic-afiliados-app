<div class="container">
  <div class="row">
    <div class="col s12">

      <p><b>{{especialidadName}}</b></p>
      <mat-selection-list #actsPanel
      (selectionChange)="onSelect($event)"
      [multiple]="false"
      *ngIf="especialidad">
        <mat-list-option
        *ngFor="let act of especialidad.actividades"
        [value]="act" [ngClass]="{'red-text': act.nombre == actSelected}">
          {{act.nombre}}
        </mat-list-option>
      </mat-selection-list>

    </div>
  </div>
</div>
