<div class="container">
  <div class="row">
    <div class="col s12" style="justify-content: center; display:flex">
      <mat-card class="mat-elevation-z4">
        <mat-card-content>
          <form class="row" [formGroup]="contactoForm">
            <div class="col s12">
              <mat-form-field appearance="outline" color="accent">
                <mat-label>Nombre</mat-label>
                <input
                  matInput
                  type="text"
                  name="nombre"
                  formControlName="nombre"
                  required
                />
                <mat-error *ngIf="contactoForm.hasError('required', 'nombre')">
                  El nombre es necesario
                </mat-error>
              </mat-form-field>
            </div>

            <!-- Email -->
            <div class="col s12">
              <mat-form-field appearance="outline" color="accent">
                <mat-label>Email</mat-label>
                <input matInput type="text" name="email" formControlName="email" />
                <mat-error *ngIf="contactoForm.hasError('email', 'email')">
                  Agrega una dirección de correo válida
                </mat-error>
              </mat-form-field>
            </div>

            <div class="col s3">
              <mat-form-field appearance="outline">
                <mat-label>Área país</mat-label>
                <input
                matInput
                type="number"
                name="area_cel"
                formControlName="area_cel"

                maxlength="2"
        minlength="1"
                >
                <mat-error *ngIf="contactoForm.hasError('required', 'area_cel')">
                  Área es necesario
                </mat-error>
              </mat-form-field>
            </div>
            <!-- Celular -->
            <div class="col s9">
              <mat-form-field appearance="outline" color="accent">
                <mat-label>Celular</mat-label>
                <input
                  matInput
                  type="text"
                  name="celular"
                  formControlName="celular"
                  required
                  (keypress)="text.onlyAllow(['numbers'], $event)"
                  maxlength="10"
                />
                <mat-error *ngIf="contactoForm.hasError('required', 'celular')">
                  Celular es necesario
                </mat-error>
                <mat-error *ngIf="contactoForm.hasError('minlength', 'celular')">
                  El número de celular debe ser al menos de 10 dígitos
                </mat-error>
                <mat-error *ngIf="contactoForm.hasError('maxlength', 'celular')">
                  El numero de celular no puede contener más de 10 dígitos
                </mat-error>
              </mat-form-field>
            </div>

            <!-- Mensaje -->
            <div class="col s12">
              <mat-form-field appearance="outline" color="accent">
                <mat-label>Mensaje</mat-label>
                <textarea
                  matInput
                  name="mensaje"
                  formControlName="mensaje"
                  required
                  rows="5"
                  [mat-autosize]="true"
                ></textarea>
                <mat-error *ngIf="contactoForm.hasError('required', 'mensaje')">
                  Mensaje es necesario
                </mat-error>
              </mat-form-field>
            </div>
          </form>


        </mat-card-content>
        <mat-card-actions style="justify-content: center; display:flex">
          <button mat-raised-button color="accent" [disabled]="contactoForm.invalid">
            Enviar
          </button>
        </mat-card-actions>
      </mat-card>

    </div>
  </div>
</div>
