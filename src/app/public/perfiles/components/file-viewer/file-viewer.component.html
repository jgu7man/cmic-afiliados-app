<ng-container *ngIf="file?.format?.includes('image'); else notImage">
  <div class="image-file">
    <img [src]="file?.url" [alt]="file?.fileName">
  </div>
</ng-container>
<ng-template #notImage >
  <p>{{file?.fileName}} </p>
</ng-template>
<a [href]="file?.url" target="_blank"> Descargar archivo </a>
