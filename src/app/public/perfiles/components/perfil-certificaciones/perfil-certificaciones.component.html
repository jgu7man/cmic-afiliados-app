<div *ngIf="items$">
  <div class="row" *ngFor="let item of items$ | async">
    <div class="col s12">
      <mat-card>
        <mat-card-header>
          <mat-card-title>{{item.nombre}}</mat-card-title>
          <mat-card-subtitle> {{item.aval}} </mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <p>Persona certificada: <span class="data-text">{{item.miembro}}</span></p>
        </mat-card-content>
      </mat-card>
    </div>
  </div>

</div>
