<mat-form-field appearance="outline">
  <mat-label><i class="fas fa-search"></i> Buscar</mat-label>
  <input
  matInput
  type="text"
  name="name"
  [formControl]="buscadorCtrl"
  [matAutocomplete]="auto"
  (keyup.ENTER)="onSubmit()"
  >
  <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn">
    <mat-option *ngFor="let actividad of filteredActividades | async" [value]="actividad">
      {{actividad.nombre}}
    </mat-option>
  </mat-autocomplete>
</mat-form-field>
