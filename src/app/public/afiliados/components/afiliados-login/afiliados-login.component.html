<div id="login-container"
style="background-image: url('/assets/img/login-afilliado.png');">
</div>
<div class="container">
  <div class="row">
    <div class="col s4 center">
      <h1 class="center">Bienvenido Afiliado</h1>
      <gdev-login-card
      signInTitle="Inicia sesión como Afiliado"
      passwordLabel="Contraseña"
      forgotPasswordLabel=""
      signInButton="Iniciar"
      (onSubmit)="onSubmit($event)"
      ></gdev-login-card>
      <p class="center">
        ¿Aún no estás registrado?
      </p>
      <button mat-raised-button color='accent'
      [routerLink]="['/afiliados/registro']"
      >Registrarse</button>
    </div>
    <div class="col s8" id="login-image"></div>
  </div>
</div>
