<div class="container">
    <div class="row">
        <div class="col s12">
            <mat-card>
                <mat-card-header>
                  <mat-card-title>Equipo y Maquinaria de la empresa</mat-card-title>
                  <mat-card-subtitle>
                    En este apartado, puedes agregar los equipos y maquinarias que tiene tu empresa, de manera que tus clientes puedan revisar sus equipos.
                  </mat-card-subtitle>
                </mat-card-header>
                <mat-card-content>
                    <mat-form-field>
                      <mat-label>Extracto</mat-label>
                      <textarea
                      placeholder="Explica en breves palabras la experiencia que la empresa tiene"
                      matInput
                      type="text"
                      name="name"
                      [formControl]="extractCtrl"
                      ></textarea>
                    </mat-form-field>
                </mat-card-content>
                <mat-card-actions>
                  <button mat-button [disabled]="extractCtrl.invalid">Guardar</button>
                </mat-card-actions>
              </mat-card>

        </div>
    </div>
</div>
