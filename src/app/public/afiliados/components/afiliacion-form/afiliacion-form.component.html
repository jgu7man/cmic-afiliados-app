<div class="container full-width">
  <div class="row">
    <div id="form" class="col s12 l5">
      <mat-vertical-stepper [linear]="true" #stepper>
        <mat-step>

        </mat-step>

        <!-- DOMICILIO -->
        <mat-step>
          <ng-template matStepLabel>Domicilio</ng-template>
          <g-direccion-form
            (invalid)="direccionBtn.disabled = $event"
            (changes)="onChanges('domicilio', $event)"
          ></g-direccion-form>
          <div>
            <button mat-button matStepperPrevious>Atrás</button>
            <button
              mat-button
              matStepperNext
              #direccionBtn="matButton"
              (click)="afiliados_.patch('domicilio', afiliado.domicilio)"
              color="secondary"
              type="button"
            >
              Siguiente
            </button>
          </div>
        </mat-step>

        <!-- DATOS DE CONTACTO -->
        <mat-step>
          <ng-template matStepLabel>Datos de contacto</ng-template>

          <g-contacto-form
            (changes)="onChanges('contacto', $event)"
            (invalid)="contactoBtn.disabled = $event"
          ></g-contacto-form>
          <div>
            <button mat-button matStepperPrevious>Atrás</button>
            <button
              #contactoBtn="matButton"
              (click)="afiliados_.patch('contacto', afiliado.contacto)"
              mat-button
              color="secondary"
              type="button"
              matStepperNext
            >
              Siguiente
            </button>
          </div>
        </mat-step>

        <!-- REPRESENTANTE LEGAL -->
        <mat-step>
          <ng-template matStepLabel>Datos de Representante Legal</ng-template>
          <g-representante-form
            (invalid)="representanteBtn.disabled = $event"
            (changes)="onChanges('representante_legal', $event)"
          ></g-representante-form>
          <div>
            <button mat-button matStepperPrevious>Atrás</button>
            <button
              #representanteBtn="matButton"
              (click)="
                afiliados_.patch(
                  'representante_legal',
                  afiliado.representante_legal
                )
              "
              mat-button
              color="secondary"
              type="button"
              matStepperNext
            >
              Siguiente
            </button>
          </div>
        </mat-step>

        <!-- DIRECTOR GENERAL -->
        <mat-step>
          <ng-template matStepLabel>Datos de director general</ng-template>
          <mat-checkbox
            [checked]="director_igual_legal"
            [(ngModel)]="director_igual_legal"
            name="director_igual"
          >
            ¿Los datos son los mismos que del representante?</mat-checkbox
          >
          <div *ngIf="!director_igual_legal">
            <g-representante-form
              (changes)="onChanges('director', $event)"
              (invalid)="director_invalid = $event"
            ></g-representante-form>
          </div>
          <div>
            <button mat-button matStepperPrevious>Atrás</button>
            <button
              #directorBtn="matButton"
              (click)="
                afiliados_.patch(
                  'representante_legal',
                  afiliado.representante_legal
                )
              "
              mat-button
              color="secondary"
              type="button"
              matStepperNext
              [disabled]="director_invalid && !director_igual_legal"
            >
              Siguiente
            </button>
          </div>
        </mat-step>

        <!-- TÉRMINOS Y CONDICIONES -->
        <mat-step>
          <ng-template matStepLabel>Continuar</ng-template>
          <p>Ahora continuamos con tu registro</p>
          <div>
            <button mat-button matStepperPrevious>Atrás</button>
            <button
              mat-raised-button
              color="accent"
              type="button"
              matStepperNext
              [routerLink]="['/afiliados/elegir-actividades', RFC]"
            >
              Siguiente
            </button>
          </div>
        </mat-step>
      </mat-vertical-stepper>
    </div>
    <div
      class="col l7"
      id="login-image"
      mxFix
      [topBreak]="76"
      [bottomSelector]="'#footer'"
    ></div>
  </div>
</div>
