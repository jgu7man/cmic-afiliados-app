<form [formGroup]="representanteForm">
  <div class="row">
    <div class="col s4">
      <mat-form-field appearance="outline">
        <mat-label>Título y/o profesión</mat-label>
        <input
          matInput
          placeholder=""
          formControlName="titulo"
          name="legal_titulo"
        />
      </mat-form-field>
    </div>

    <div class="col s8">
      <mat-form-field appearance="outline">
        <mat-label>Nombre(s)</mat-label>
        <input
          matInput
          placeholder=""
          formControlName="nombre"
          name="legal_nombre"
          required
        />
        <mat-error
          *ngIf="representanteForm.hasError('required', 'legal_nombre')"
        >
          Este campo es necesario
        </mat-error>
      </mat-form-field>
    </div>

    <div class="col s12 m6">
      <mat-form-field appearance="outline">
        <mat-label>Apellido Paterno</mat-label>
        <input
          matInput
          placeholder=""
          formControlName="apellido_pat"
          name="legal_apellido_pat"
          required
        />
        <mat-error
          *ngIf="representanteForm.hasError('required', 'legal_apellido_pat')"
        >
          Este campo es necesario
        </mat-error>
      </mat-form-field>
    </div>

    <div class="col s12 m6">
      <mat-form-field appearance="outline">
        <mat-label>Apellido Materno</mat-label>
        <input
          matInput
          placeholder=""
          formControlName="apellido_mat"
          name="legal_apellido_mat"
          required
        />
        <mat-error
          *ngIf="representanteForm.hasError('required', 'legal_apellido_mat')"
        >
          Este campo es necesario
        </mat-error>
      </mat-form-field>
    </div>

    <div class="col s12 m6">
      <mat-form-field appearance="outline">
        <mat-label>Género</mat-label>
        <mat-select
          placeholder="Si lo deseas, expresa tu género"
          formControlName="sexo"
          name="legal_sexo"
        >
          <mat-option value=""> No especificar </mat-option>
          <mat-option value="Mujer"> Mujer </mat-option>
          <mat-option value="Hombre"> Hombre </mat-option>
          <mat-option value="Otro"> Otro </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="col s12 m6">
      <mat-form-field appearance="outline">
        <mat-label>Fecha de nacimiento</mat-label>
        <input
          matInput
          [matDatepicker]="picker"
          formControlName="fecha_nacimiento"
          name="fecha_nacimiento"
          required
        />
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
        <mat-error
          *ngIf="representanteForm.hasError('required', 'fecha_nacimiento')"
        >
          Este campo es necesario
        </mat-error>
      </mat-form-field>
    </div>

    <form formGroupName="contacto">
      <div class="col s12">
        <mat-form-field appearance="outline">
          <mat-label> Teléfono</mat-label>
          <input
            matInput
            placeholder="Ingrese teléfono"
            formControlName="telefono"
            name="legal_telefono"
          />
        </mat-form-field>
      </div>

      <div class="col s12">
        <mat-form-field appearance="outline">
          <mat-label> Celular</mat-label>
          <input
            matInput
            placeholder="Ingrese celular"
            formControlName="celular"
            name="legal_celular"
            required
          />
          <mat-error *ngIf="representanteForm.hasError('required', 'celular')">
            Este campo es necesario
          </mat-error>
        </mat-form-field>
      </div>

      <div class="col s12">
        <mat-form-field appearance="outline">
          <mat-label>E-mail</mat-label>
          <input
            matInput
            placeholder="Ingrese email"
            formControlName="email"
            name="legal_email"
            required
          />
          <mat-error *ngIf="representanteForm.hasError('required', 'email')">
            El email es necesario
          </mat-error>
        </mat-form-field>
      </div>
    </form>
  </div>
</form>
