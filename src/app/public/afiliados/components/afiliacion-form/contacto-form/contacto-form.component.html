<form [formGroup]="contactoForm">
  <div class="row">
    <div class="col s12 l6">
      <mat-form-field appearance="outline">
        <mat-label> Teléfono</mat-label>
        <input matInput placeholder="Ingrese teléfono" formControlName="telefono" name="telefono"
           >


      </mat-form-field>
    </div>

    <div class="col s12 l6">
      <mat-form-field appearance="outline">
        <mat-label>Celular</mat-label>
        <input matInput placeholder="Ingrese teléfono" formControlName="celular" name="celular"
           required>

        <mat-error *ngIf="contactoForm.hasError('required', 'celular')">
          Este campo es necesario
        </mat-error>
      </mat-form-field>
    </div>
    <div class="col s12">
      <mat-form-field appearance="outline">
        <mat-label>E-mail</mat-label>
        <input matInput placeholder="Ingrese email" formControlName="email" type="email" name="email"
           required>

        <mat-error *ngIf="contactoForm.hasError('required', 'email')">
          Este campo es necesario
        </mat-error>
      </mat-form-field>
    </div>
    <div class="col s12">
      <mat-form-field appearance="outline">
        <mat-label>Página Web</mat-label>
        <input matInput placeholder="Ingrese url de pagina web" formControlName="pagina_web"
          name="pagina_web" >
      </mat-form-field>
    </div>
    <div class="col s12">
      <mat-checkbox [checked]="contactoForm.value.mostrar_en_directorios"
      formControlName="mostrar_en_directorios"
      name="mostrar_en_directorios"
      name="directorios">
        Autorizo que los datos aparezcan en los directorios de “Especialidades CMIC” así como en “Oportunidades de Negocio”
      </mat-checkbox>
    </div>
  </div>

</form>
