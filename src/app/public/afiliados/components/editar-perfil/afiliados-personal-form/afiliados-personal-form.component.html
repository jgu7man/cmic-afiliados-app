<mat-card>
  <mat-card-header>
    <mat-card-title>Personal</mat-card-title>
    <mat-card-subtitle>Define los datos de tu personal</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <form class="row">
      <div class="col s12 m6 l3">
        <mat-form-field>
          <mat-label>Planta Fija</mat-label>
          <input
            matInput
            type="text"
            name="planta_fija"
            formControlName="planta_fija"
            required
          />
        </mat-form-field>
      </div>

      <div class="col s12 m6 l3">
        <mat-form-field>
          <mat-label>Capacidad por proyecto</mat-label>
          <input
            matInput
            type="text"
            name="capacidad_proyecto"
            formControlName="capacidad_proyecto"
            required
          />
        </mat-form-field>
      </div>

      <div class="col s12 m6 l3">
        <mat-form-field>
          <mat-label>Hombres</mat-label>
          <input
            matInput
            type="text"
            name="hombres"
            formControlName="hombres"
          />
        </mat-form-field>
      </div>

      <div class="col s12 m6 l3">
        <mat-form-field>
          <mat-label>Mujeres</mat-label>
          <input
            matInput
            type="text"
            name="mujeres"
            formControlName="mujeres"
          />
        </mat-form-field>
      </div>
    </form>
  </mat-card-content>
  <mat-card-actions>
    <button mat-button>Ok</button>
  </mat-card-actions>
</mat-card>
