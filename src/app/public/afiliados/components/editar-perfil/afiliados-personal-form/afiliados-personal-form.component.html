<mat-card>
  <mat-card-header>
    <mat-card-title>Personal</mat-card-title>
    <mat-card-subtitle>Define los datos de tu personal</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="personalForm" class="row">
      <div class="col s12 m7">
        <mat-form-field>
          <mat-label>Planta Fija</mat-label>
          <input
            matInput
            type="number"
            name="planta_fija"
            formControlName="planta_fija"
            required
          />
        </mat-form-field>
      </div>

      <div class="col s12 m7">
        <mat-form-field>
          <mat-label>Capacidad por proyecto</mat-label>
          <input
            matInput
            type="number"
            name="capacidad_proyecto"
            formControlName="capacidad_proyecto"
            required
          />
        </mat-form-field>
      </div>

      <div class="col s12 m7">
        <mat-form-field>
          <mat-label>Hombres laborando</mat-label>
          <input
            matInput
            type="number"
            name="hombres"
            formControlName="hombres"
          />
        </mat-form-field>
      </div>

      <div class="col s12 m7">
        <mat-form-field>
          <mat-label>Mujeres laborando</mat-label>
          <input
            matInput
            type="number"
            name="mujeres"
            formControlName="mujeres"
          />
        </mat-form-field>
      </div>
    </form>
  </mat-card-content>
  <mat-card-actions>
    <button mat-raised-button
    color="secondary"
    (click)="onSubmit()"
    [disabled]="personalForm.invalid && personalForm.pristine"
    >Guardar</button>
  </mat-card-actions>
</mat-card>
