<div class="container full-width" >
  <div class="row" >
    <div class="col l5 center" id="form" >
      <h1>REGISTRO</h1>
      <p>Regístrate aquí y promueve tus servicios</p>
      <form [formGroup]="managerForm">
        <div class="row">


          <div class="col s12">
            <mat-form-field appearance="outline">
              <mat-label>Nombre</mat-label>
              <input
              matInput
              type="text"
              name="nombre"
              formControlName="nombre"
              >
              <mat-error *ngIf="managerForm.hasError('required', 'nombre')">
              Nombre es necesario
              </mat-error>
            </mat-form-field>
          </div>


          <div class="col s12">
            <mat-form-field appearance="outline">
              <mat-label>Apellido Paterno</mat-label>
              <input
              matInput
              type="text"
              name="paterno"
              formControlName="paterno"
              >
              <mat-error *ngIf="managerForm.hasError('required', 'paterno')">
              El apellido paterno es necesario
              </mat-error>
            </mat-form-field>
          </div>

          <div class="col s12">
            <mat-form-field appearance="outline">
              <mat-label>Apellido Materno</mat-label>
              <input
              matInput
              type="text"
              name="materno"
              formControlName="materno"
              >
            </mat-form-field>
          </div>

          <div class="col s12">
            <mat-form-field appearance="outline">
              <mat-label>Contraseña</mat-label>
              <input
                matInput
                placeholder="Ingrese su contraseña"
                formControlName="contrasena"
                [type]="hide ? 'password' : 'text'"
                required
                name="contrasena"
              />
              <mat-error *ngIf="managerForm.hasError('required', 'contrasena')">
                Por favor ingrese su contraseña
              </mat-error>
              <button
                mat-icon-button
                matSuffix
                (click)="hide = !hide"
                [attr.aria-label]="'Hide password'"
                [attr.aria-pressed]="hide"
              >
                <mat-icon>{{
                  hide ? "visibility_off" : "visibility"
                }}</mat-icon>
              </button>
            </mat-form-field>
          </div>

          <div class="col s12">
            <mat-form-field appearance="outline">
              <mat-label>Confirme contraseña</mat-label>
              <input
                matInput
                placeholder="Confirme su contraseña"
                formControlName="confcontrasena"
                [type]="hide ? 'password' : 'text'"
                required
                [errorStateMatcher]="matcher"
                name="confirma"
              />

              <mat-error *ngIf="managerForm.hasError('required', 'confcontrasena')">
                Por favor confirme su contraseña
              </mat-error>
              <mat-error *ngIf="managerForm.hasError('notSame')">
                La contraseña ingresada debe ser igual
              </mat-error>
              <button
                mat-icon-button
                matSuffix
                (click)="hide = !hide"
                [attr.aria-label]="'Hide password'"
                [attr.aria-pressed]="hide"
              >
                <mat-icon>{{ hide ? "visibility_off" : "visibility" }}</mat-icon>
              </button>
            </mat-form-field>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
