<div id="topbar">
  <div id="red-bar"></div>
  <mat-toolbar class="mat-elevation-z5">
    <!-- LOGO -->
    <div class="logo-container" [routerLink]="['/']">
      <img src="/assets/img/cmic-logo-h.png" alt="logo CMIC" />
    </div>

    <!-- MENÚS -->
    <div>
      <!-- Logged -->

      <a *ngIf="admin"
        class="topbar-item"
        color="primary"
        mat-button
        [mat-menu-trigger-for]="unloggedMenu"
      >
        {{admin?.email}}
      </a>
      <mat-menu #unloggedMenu="matMenu">
        <button mat-menu-item (click)="onSingOut()">Cerrar Sesión</button>
      </mat-menu>
    </div>
  </mat-toolbar>
</div>
