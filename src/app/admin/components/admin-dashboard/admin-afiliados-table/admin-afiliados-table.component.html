<div class="container">
  <div class="row">
    <div class="col s12">

      <mat-card>
        <mat-card-header>
          <mat-card-title>Afiliados</mat-card-title>
          <mat-card-subtitle>Aquí podrás ver todas las empresas afiliadas y dadas de alta en el sitio</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <p>Puedes buscar alguna empresa, actividad o especialidad</p>
          <g-searcher></g-searcher>

        </mat-card-content>
        <mat-card-actions>
          <button mat-button color="accent"
          (click)="onDownload()"
          >Descargar lista completa</button>
        </mat-card-actions>
      </mat-card>

    </div>
  </div>

  <div class="row">
    <div class="col s12">
      <mat-card>
        <mat-card-content>
          <table mat-table [dataSource]="afiliados" matSort >

            <!-- Name Column -->
            <ng-container matColumnDef="nombre">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre </th>
              <td mat-cell *matCellDef="let afiliado"> {{afiliado.datos_generales.comercial_nombre}} </td>
            </ng-container>

            <!-- RFC Column -->
            <ng-container matColumnDef="RFC">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> RFC </th>
              <td mat-cell *matCellDef="let afiliado"> {{afiliado.datos_generales.RFC}} </td>
            </ng-container>



            <!-- Options Column -->
            <ng-container matColumnDef="options">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> </th>
              <td mat-cell class="options" *matCellDef="let afiliado">
                <!-- <i class="fas fa-external-link-alt green-text"
                (click)="onSelect(afiliado)"></i> -->
                <button mat-icon-button (click)="onOptions(afiliado)">
                  <i class="fas fa-ellipsis-v"></i>
                </button>
              </td>
            </ng-container>



            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row class="row-item" *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
          <mat-paginator [length]="afiliados.length"
                        [pageSize]="pageSize"
                        [pageSizeOptions]="[5, 10, 25, 100]"
                        (page)="onPageEvent($event)"

                        >
          </mat-paginator>

        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
