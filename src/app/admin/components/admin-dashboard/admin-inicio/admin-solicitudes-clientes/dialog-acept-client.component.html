<mat-dialog-content>
  <div class="row">
    <div class="col s12">
      <p class="center">Enviar correo de creación de cuenta para {{peticion.comercial_nombre}} </p>
      <p>RFC: <span class="data-text">
        {{peticion.RFC}}
      </span></p>
      <p>Email: <span class="data-text">
        {{peticion.email}}
      </span></p>

    </div>
  </div>
  <div class="row">
    <div class="col s12">
      <mat-grid-list cols="2" rowHeight="1:1" >
        <mat-grid-tile class="file-container">
          <img [src]="peticion.INEfile.url" [alt]="peticion.INEfile.fileName">
        </mat-grid-tile>
      </mat-grid-list>

    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions
style="display: flex; justify-content: space-around;">
    <button mat-raised-button
    color="accent"
    (click)="clientes.responseRequest(peticion, false)"
    (click)="dialog.close()"
    >Eliminar</button>
    <button mat-raised-button
    color="primary"
    (click)="clientes.responseRequest(peticion, true)"
    (click)="dialog.close()"
    >Aceptar</button>
</mat-dialog-actions>
