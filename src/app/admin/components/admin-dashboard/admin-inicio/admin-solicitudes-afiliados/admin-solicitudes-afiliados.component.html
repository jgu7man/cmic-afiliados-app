<mat-card>
  <mat-card-header>
    <mat-card-title>Solicitudes de afiliados</mat-card-title>
  </mat-card-header>
  <mat-card-content>

    <ng-container *ngIf="afiliados.length > 0; else empty">
      <table mat-table [dataSource]="afiliados" matSort>

        <!-- Nombre comercial Column -->
        <ng-container matColumnDef="empresa.comercial_nombre">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Comercio </th>
          <td mat-cell *matCellDef="let afiliado"> {{afiliado.empresa.comercial_nombre}} </td>
        </ng-container>

        <!-- Email Column -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
          <td mat-cell *matCellDef="let afiliado"> {{afiliado.email}} </td>
        </ng-container>


        <!-- Request Column -->
        <ng-container matColumnDef="request">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Fecha de petición </th>
          <td mat-cell *matCellDef="let afiliado">
            {{toDate(afiliado.request) | date: 'dd / MMM / yy - HH:mm'}}
          </td>
        </ng-container>



        <!-- Options Column -->
        <ng-container matColumnDef="options">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> </th>
          <td mat-cell class="options" *matCellDef="let afiliado"
          (click)="seeRequest(afiliado)">
            <i class="fas fa-eye green-text"></i>
          </td>
        </ng-container>



        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row class="row-item" *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
      <mat-paginator [length]="afiliados.length"
                    [pageSize]="pageSize"
                    (page)="onPageEvent($event)"

                    >
      </mat-paginator>
      </ng-container>

    <ng-template #empty >
      <p class="center data-text">
        Por ahora no hay nuevas solicitudes de afiliados
      </p>
    </ng-template>

  </mat-card-content>
</mat-card>
