<mat-card>
  <mat-card-header>
    <mat-card-title>Mensajes de contacto</mat-card-title>
  </mat-card-header>
  <mat-card-content>

    <ng-container *ngIf="mensajes.length > 0; else empty">
      <table mat-table [dataSource]="mensajes" matSort>

        <!-- Fecha -->
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Fecha </th>
          <td mat-cell *matCellDef="let mensaje">
            <ng-container *ngIf="mensaje.date; else noDate">
              {{mensaje.date | toDate | date: 'short'}}
            </ng-container>
            <ng-template #noDate >
              No fecha
            </ng-template>
          </td>
        </ng-container>

        <!-- Nombre Column -->
        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre </th>
          <td mat-cell *matCellDef="let mensaje"> {{mensaje.nombre}} </td>
        </ng-container>



        <!-- Options Column -->
        <ng-container matColumnDef="options">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> </th>
          <td mat-cell class="options" *matCellDef="let mensaje"
          (click)="seeRequest(mensaje)">
            <i class="fas fa-eye green-text"></i>
          </td>
        </ng-container>



        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row class="row-item" *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
      <mat-paginator [length]="mensajes.length"
                    [pageSize]="pageSize"
                    (page)="onPageEvent($event)"

                    >
      </mat-paginator>
      </ng-container>

    <ng-template #empty >
      <p class="center data-text">
        Por ahora no hay mensajes
      </p>
    </ng-template>

  </mat-card-content>
</mat-card>
