<p mat-dialog-title>Enviar invitación de acceso</p>
<mat-dialog-content>

<form [formGroup]="accesoForm">

  <div class="row">
    <div class="col s12">
      <mat-form-field appearance="outline">
        <mat-label>Correo</mat-label>
        <input
        matInput
        type="text"
        name="correo"
        formControlName="email"
        >
        <mat-error *ngIf="accesoForm.hasError('required', 'email')">
         Correo es necesario
        </mat-error>
        <mat-error *ngIf="accesoForm.hasError('email', 'email')">
         Agrega una dirección de correo válida
        </mat-error>
      </mat-form-field>
    </div>

    <div class="col s12">
      <mat-form-field appearance="outline">
        <mat-label>Tipo de acceso</mat-label>
        <mat-select placeholder="Elige el tipo de acceso" id="perfil" formControlName="perfil" name="perfil">
          <mat-option *ngFor="let perfil of accesos.Roles" [value]="perfil.name">
            {{perfil.displayName}}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>

</form>

</mat-dialog-content>

<mat-dialog-actions
style="display: flex; justify-content: space-around;">
    <button mat-raised-button
    color="secondary"
    (click)="dialog.close()"
    >Cancelar</button>
    <button mat-raised-button
    color="accent"
    (click)="onSubmit()"
    >Enviar</button>
</mat-dialog-actions>
