<table mat-table [dataSource]="clientes" matSort class="mat-elevation-z8">

  <!-- Name Column -->
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Usuario </th>
    <td mat-cell *matCellDef="let cliente"> {{cliente.email}} </td>
  </ng-container>


  <!-- Last Access Column -->
  <ng-container matColumnDef="lastAccess">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Último Acceso </th>
    <td mat-cell *matCellDef="let cliente"> {{cliente.lastAccess}} </td>
  </ng-container>

  <!-- Last Access Column -->
  <ng-container matColumnDef="access">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>  </th>
    <td mat-cell *matCellDef="let cliente">
      <span [ngClass]="{'revoke': cliente.access}">{{cliente.access}}</span>
    </td>
  </ng-container>

  <!-- Options Column -->
  <ng-container matColumnDef="options">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> </th>
    <td mat-cell class="options" *matCellDef="let cliente">
      <i class="fas fa-times-circle red-text"
      (click)="toRevoke(cliente)"></i>
    </td>
  </ng-container>



  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row class="row-item" *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
<mat-paginator [length]="clientes.length"
              [pageSize]="pageSize"
              [pageSizeOptions]="[5, 10, 25, 100]"
              (page)="onPageEvent($event)"

              >
</mat-paginator>
